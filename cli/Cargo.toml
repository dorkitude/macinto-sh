[package]
name = "macinto-cli"
version = "0.1.0"
edition = "2021"
description = "Command line client and MCP server for Macinto.sh.app"
license = "MIT"
repository = "https://github.com/dorkitude/macinto.sh"
publish = false

# Cargo binary names can't contain a dot; the Makefile installs this as Contents/Helpers/macinto.sh.
[[bin]]
name = "macinto_sh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
